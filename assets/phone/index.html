<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#8c3818">
<title>Gobble Grand Prix pad</title>
<style>
  * { box-sizing: border-box; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  html, body { margin: 0; height: 100%; overflow: hidden; touch-action: none;
    background: #8c3818; color: #faeed2; font: 600 16px system-ui, sans-serif; }
  #app { position: fixed; inset: 0; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto 1fr; }
  #bar { grid-column: 1 / 3; display: flex; gap: 8px; align-items: center; padding: 6px 10px;
    background: rgba(64, 26, 10, .85); flex-wrap: wrap; }
  #bar .grow { flex: 1; }
  button { font: inherit; color: #faeed2; background: #5a2410; border: 2px solid #ffd25a;
    border-radius: 12px; padding: 6px 12px; }
  button.on, button:active { background: #ffd25a; color: #401a0a; }
  #steer { position: relative; margin: 10px; border-radius: 20px; background: rgba(64, 26, 10, .5); }
  #steer .knob { position: absolute; top: 50%; left: 50%; width: 70px; height: 70px; margin: -35px;
    border-radius: 50%; background: #ffd25a; }
  #steer .hint { position: absolute; bottom: 8px; width: 100%; text-align: center; opacity: .7; }
  #right { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; margin: 10px; }
  #right button { font-size: 22px; border-radius: 20px; }
  #gas { grid-row: 1 / 3; grid-column: 2; }
  #menu { display: flex; gap: 4px; }
  #menu button { padding: 6px 10px; }
  #cover { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center;
    justify-content: center; background: #8c3818; text-align: center; padding: 20px; z-index: 2; }
  #cover h1 { color: #ffd25a; margin: 0; }
  input[type=range] { width: 110px; }
  label { display: flex; gap: 4px; align-items: center; }
</style>
</head>
<body>
<div id="cover">
  <h1>Gobble Grand Prix</h1>
  <div id="status">Tap to connect. Turn your phone sideways.</div>
  <button id="go" style="font-size:24px;padding:14px 30px">Tap to start</button>
</div>
<div id="app">
  <div id="bar">
    <button id="pause">Pause</button>
    <div id="menu">
      <button data-k="left">&#9664;</button><button data-k="up">&#9650;</button>
      <button data-k="down">&#9660;</button><button data-k="right">&#9654;</button>
      <button data-k="ok">OK</button><button data-k="back">Back</button>
    </div>
    <span class="grow"></span>
    <button id="gyro">Tilt: off</button>
    <button id="cal">Calibrate</button>
    <label>Sens <input id="sens" type="range" min="10" max="60" value="30"></label>
    <label><input id="inv" type="checkbox">Invert</label>
    <span id="ping">--</span>
  </div>
  <div id="steer"><div class="knob" id="knob"></div><div class="hint" id="hint">Drag to steer</div></div>
  <div id="right">
    <button id="drift">Drift</button>
    <button id="gas">Gas</button>
    <button id="item">Item</button>
    <button id="brake">Brake</button>
  </div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const pin = new URLSearchParams(location.search).get("pin") || prompt("Room PIN") || "";
const state = { steer: 0, gas: false, brake: false, drift: false, item: false };
let ws = null, seq = 0, gyro = false, tilt = 0, center = 0;

function connect() {
  ws = new WebSocket(`wss://${location.host}/ws?pin=${encodeURIComponent(pin)}`);
  ws.onopen = () => { $("cover").style.display = "none"; };
  ws.onclose = () => {
    $("cover").style.display = "flex";
    $("status").textContent = "Disconnected. Wrong PIN, or the game closed. Tap to retry.";
  };
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.t === "buzz" && navigator.vibrate) navigator.vibrate(msg.ms);
    if (msg.t === "ack") $("ping").textContent = `${Math.round(performance.now() - msg.ms)} ms`;
  };
}

$("go").onclick = async () => {
  // iOS asks for motion access from a tap
  for (const api of [window.DeviceMotionEvent, window.DeviceOrientationEvent]) {
    if (api && typeof api.requestPermission === "function") {
      try { await api.requestPermission(); } catch (e) {}
    }
  }
  try { await document.documentElement.requestFullscreen(); } catch (e) {}
  try { await screen.orientation.lock("landscape"); } catch (e) {}
  connect();
};

// Steering by tilt: the roll of gravity in the screen plane, like holding a wheel
window.addEventListener("devicemotion", (event) => {
  const g = event.accelerationIncludingGravity;
  if (!g || g.x === null) return;
  const angle = (screen.orientation && screen.orientation.angle) || window.orientation || 0;
  const rad = (angle * Math.PI) / 180;
  const x = g.x * Math.cos(rad) + g.y * Math.sin(rad);
  const y = -g.x * Math.sin(rad) + g.y * Math.cos(rad);
  tilt = (Math.atan2(x, -y) * 180) / Math.PI;
});
$("gyro").onclick = () => {
  gyro = !gyro;
  center = tilt;
  $("gyro").textContent = `Tilt: ${gyro ? "on" : "off"}`;
  $("gyro").classList.toggle("on", gyro);
  $("hint").textContent = gyro ? "Tilt to steer" : "Drag to steer";
};
$("cal").onclick = () => { center = tilt; };

// Touch steering, the fallback
const pad = $("steer"), knob = $("knob");
let steerTouch = null;
function touchSteer(event) {
  for (const t of event.changedTouches) {
    if (event.type === "touchstart" && steerTouch === null) steerTouch = t.identifier;
    if (t.identifier !== steerTouch) continue;
    if (event.type === "touchend" || event.type === "touchcancel") { steerTouch = null; state.steer = 0; continue; }
    const r = pad.getBoundingClientRect();
    const dx = (t.clientX - (r.left + r.width / 2)) / (r.width / 2);
    state.steer = -Math.max(-1, Math.min(1, dx * 1.3));
  }
  event.preventDefault();
}
for (const type of ["touchstart", "touchmove", "touchend", "touchcancel"]) pad.addEventListener(type, touchSteer);

function hold(id, key) {
  const el = $(id);
  const set = (v) => (e) => { state[key] = v; el.classList.toggle("on", v); e.preventDefault(); };
  el.addEventListener("touchstart", set(true));
  el.addEventListener("touchend", set(false));
  el.addEventListener("touchcancel", set(false));
  el.addEventListener("mousedown", set(true));
  el.addEventListener("mouseup", set(false));
}
hold("gas", "gas"); hold("brake", "brake"); hold("drift", "drift");
$("item").addEventListener("touchstart", (e) => { state.item = true; e.preventDefault(); });
$("item").addEventListener("mousedown", () => { state.item = true; });

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
for (const b of document.querySelectorAll("#menu button")) {
  b.addEventListener("click", () => send({ t: "menu", k: b.dataset.k }));
}
$("pause").onclick = () => send({ t: "menu", k: "pause" });

// 60 Hz input
setInterval(() => {
  if (gyro) {
    const sens = Number($("sens").value);
    let d = tilt - center;
    d = Math.abs(d) < 3 ? 0 : d - Math.sign(d) * 3;
    let s = Math.max(-1, Math.min(1, d / sens));
    if ($("inv").checked) s = -s;
    if (steerTouch === null) state.steer = s;
  }
  knob.style.left = `${50 - state.steer * 40}%`;
  send({ t: "in", s: ++seq, ms: performance.now(), ...state });
  state.item = false;
}, 1000 / 60);
</script>
</body>
</html>
