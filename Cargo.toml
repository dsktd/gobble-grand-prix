[package]
name = "super-slop-kart"
version = "0.1.0"
edition = "2024"
license = "Unlicense"
description = "Super Slop Kart: a pool-hall kart racer made with Bevy"
repository = "https://github.com/dsktd/gobble-grand-prix"
keywords = ["game", "racing", "bevy"]
categories = ["games"]

[dependencies]
# BEVY
bevy = { version = "0.20.1", features = ["wayland", "wav", "mp3", "flac"] }

rand = "0.9"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] } # text measuring for fit_text

# PHONE CONTROLLER
anyhow = "1"
axum = { version = "0.8.9", features = ["ws"] } # https://github.com/tokio-rs/axum
axum-server = { version = "0.9.2", features = ["tls-rustls-ring"] } # https://github.com/programatik29/axum-server
dirs = "6"
iroh = "1.3" # https://github.com/n0-computer/iroh
futures-util = "0.3"
qrcode = { version = "0.14.1", default-features = false } # https://github.com/kennytm/qrcode-rust
rcgen = { version = "0.14.1", default-features = false, features = ["crypto", "pem", "ring"] } # https://github.com/rustls/rcgen
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "io-util"] }

[profile.dev]
opt-level = 1
debug = 0
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin" # lto = true is slower to link for little gain
codegen-units = 1
panic = 'abort'
strip = true

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Bevy's dependency tree pulls several versions of the same crate; not ours to fix.
multiple_crate_versions = "allow"
# Bevy systems take Res/Query/Commands parameters by value; the signature is the API.
needless_pass_by_value = "allow"
# Bevy system functions routinely take many parameters and complex query types.
too_many_arguments = "allow"
type_complexity = "allow"
# Game maths is f32/usize/i32 throughout; values are small and bounded, so these casts are deliberate.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Fused multiply-add rewrites hurt readability of tuning formulas and change nothing visible.
suboptimal_flops = "allow"
# Exact float comparisons are used on sentinel values, not computed results.
float_cmp = "allow"
# Setup and menu-building systems are long straight-line spawn code.
too_many_lines = "allow"
# Settings and state structs are flag bags; splitting them adds nothing.
struct_excessive_bools = "allow"
# Vector and colour maths uses x/y/z/r/g/b style names.
many_single_char_names = "allow"
similar_names = "allow"
# Conflicts with rustc's unreachable_pub style; modules here use pub(crate) on purpose.
redundant_pub_crate = "allow"
# Asset and input tables list each (family, action) pair on its own arm so one can change alone.
match_same_arms = "allow"
# Walking a float distance along the track in fixed steps is the intent.
while_float = "allow"
# Bevy hands out Res<T> and many call sites pass &T through; by-value would add churn for nothing.
trivially_copy_pass_by_ref = "allow"

# Fast iterative Deck builds; release stays for CI and tags
[profile.deck-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
incremental = true
